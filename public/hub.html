<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTK 데모 1 · 허브</title>
<style>
  :root { --navy:#1E2761; --navy-dark:#0F1838; --amber:#D4A574; --ice:#F0F4FA; --text-mid:#475569; --text-muted:#64748B; --border:#E2E8F0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:linear-gradient(135deg,var(--ice) 0%,#fff 100%); color:#1F2937; min-height:100vh; padding:24px; display:flex; flex-direction:column; align-items:center; }
  .header { background:var(--navy); color:#fff; padding:20px 28px; border-radius:12px; max-width:520px; width:100%; margin:0 auto 20px; display:flex; justify-content:center; align-items:center; gap:18px; }
  .header h1 { font-size:20px; letter-spacing:.5px; }
  .lang-switch { display:flex; gap:4px; }
  .lang-switch button { padding:5px 12px; border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; border-radius:6px; font-size:14.4px; font-weight:bold; cursor:pointer; font-family:inherit; letter-spacing:1px; }
  .lang-switch button.on { background:var(--amber); border-color:var(--amber); color:var(--navy); }
  .lang-switch .hub-btn { margin-left:8px; display:inline-flex; align-items:center; justify-content:center; padding:4px 10px; border-color:var(--amber); color:var(--amber); }
  .lang-switch .hub-btn svg { display:block; }
  .lang-switch .hub-btn:hover { background:var(--amber); color:var(--navy); }
  .panel { background:#fff; border-radius:16px; padding:30px 28px; box-shadow:0 2px 8px rgba(0,0,0,.06); border:1px solid var(--border); max-width:520px; width:100%; text-align:center; }
  .panel h2 { font-size:23px; color:var(--navy); margin-bottom:10px; }
  .panel p { font-size:16px; color:var(--text-mid); line-height:1.65; margin-bottom:20px; }
  .qr-box { background:#fff; padding:18px; border:2px solid var(--border); border-radius:14px; display:inline-block; }
  .qr-box img { display:block; width:360px; height:360px; max-width:100%; border-radius:8px; }
  .wait { color:var(--text-muted); padding:150px 40px; font-size:15px; }
  .status { margin-top:20px; font-size:15px; color:var(--text-muted); }
  .status.on { color:var(--navy); font-weight:bold; }
</style>
</head>
<body>
  <div class="header">
    <h1 id="appTitle">VTK 데모 1</h1>
    <div class="lang-switch"><button id="langKo" class="on">KO</button><button id="langEn">EN</button><button id="btnHub" class="hub-btn" title="홈" aria-label="홈"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button></div>
  </div>
  <div class="panel">
    <h2 id="hTitle">휴대폰으로 스캔하여 시작</h2>
    <p id="hDesc">아래 QR을 휴대폰 카메라로 스캔하세요. 휴대폰에 로그인 화면이 열리고, 이 화면에는 키패드가 나타납니다.</p>
    <div class="qr-box" id="qrBox"><div class="wait" id="qrWait">QR 생성 중…</div></div>
    <div class="status" id="status">휴대폰 스캔을 기다리는 중…</div>
  </div>

<script src="qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const APP_TITLE_KO = 'VTK 데모 1', APP_TITLE_EN = 'VTK Demo 1';
let LANG = (function(){ const q=new URLSearchParams(location.search).get('lang'); if(q==='ko'||q==='en')return q; return (navigator.language||'').toLowerCase().startsWith('ko')?'ko':'en'; })();
const I18N = {
  ko: { hTitle:'휴대폰으로 스캔하여 시작', hDesc:'아래 QR을 휴대폰 카메라로 스캔하세요. 휴대폰에 로그인 화면이 열리고, 이 화면에는 키패드가 나타납니다.', status:'휴대폰 스캔을 기다리는 중…', paired:'휴대폰 연결됨 — 키패드를 준비합니다…', qrWait:'QR 생성 중…', qrFail:'QR 생성 실패 — 새로고침 해주세요.' },
  en: { hTitle:'Scan with your phone to start', hDesc:'Scan the QR below with your phone camera. The login screen opens on your phone and this screen shows the keypad.', status:'Waiting for a phone to scan…', paired:'Phone connected — preparing the keypad…', qrWait:'Generating QR…', qrFail:'QR generation failed — please refresh.' }
};
function t(k){ return (I18N[LANG]&&I18N[LANG][k]!==undefined)?I18N[LANG][k]:I18N.ko[k]; }
// 허브 1회 식별자(디스플레이↔휴대폰 페어링용)
const hubId = (window.crypto&&crypto.getRandomValues) ? [...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('') : (String(Date.now())+Math.random().toString(16).slice(2,10));
function scanUrl(){ const u=new URL(location.origin+'/scan'); u.searchParams.set('h',hubId); u.searchParams.set('lang',LANG); return u.toString(); }
function renderQr(){
  const data=scanUrl(), size=480, disp=360;
  const box=document.getElementById('qrBox'); if(!box) return;
  const canvas=document.createElement('canvas'); canvas.alt='QR';
  QRCode.toCanvas(canvas, data, { width:size, margin:2, color:{ dark:'#1E2761', light:'#ffffff' } }, function(err){
    if(err){ box.innerHTML='<div class="wait">'+t('qrFail')+'</div>'; return; }
    canvas.style.cssText='display:block;width:'+disp+'px;height:'+disp+'px;max-width:100%;border-radius:8px;';
    box.innerHTML=''; box.appendChild(canvas);
  });
}
function applyLang(){
  document.documentElement.lang=LANG; document.title=(LANG==='en'?APP_TITLE_EN:APP_TITLE_KO)+' · Hub';
  document.getElementById('appTitle').textContent=(LANG==='en'?APP_TITLE_EN:APP_TITLE_KO);
  document.getElementById('hTitle').textContent=t('hTitle');
  document.getElementById('hDesc').textContent=t('hDesc');
  const st=document.getElementById('status'); if(!st.classList.contains('on')) st.textContent=t('status');
  document.getElementById('langKo').classList.toggle('on',LANG==='ko');
  document.getElementById('langEn').classList.toggle('on',LANG==='en');
  renderQr();
}
document.getElementById('langKo').onclick=()=>{ LANG='ko'; const u=new URL(location.href); u.searchParams.set('lang','ko'); history.replaceState(null,'',u); applyLang(); };
document.getElementById('langEn').onclick=()=>{ LANG='en'; const u=new URL(location.href); u.searchParams.set('lang','en'); history.replaceState(null,'',u); applyLang(); };
document.getElementById('btnHub').onclick=()=>{ location.href='/hub?lang='+LANG; };   // 집(홈) → 허브 첫 화면으로 새로 시작
function joinHub(){ socket.emit('join-hub',{ hubId }); }
socket.on('connect', joinHub); joinHub();
socket.on('hub-paired', () => {
  const st=document.getElementById('status'); st.classList.add('on'); st.textContent=t('paired');
  setTimeout(()=>{ location.href='/?lang='+LANG+'&h='+hubId; }, 700);
});
applyLang();
</script>
</body>
</html>
