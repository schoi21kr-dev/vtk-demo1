<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTK 스캔</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#0F1838; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
  #content { width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; }
  .msg { text-align:center; padding:48px 22px; }
  .msg h2 { font-size:23px; margin-bottom:16px; }
  .msg p { font-size:15px; color:#CBD5E1; line-height:1.75; }
  .spinner { border:3px solid rgba(255,255,255,.18); border-top:3px solid #D4A574; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:0 auto 22px; }
  @keyframes spin { 100% { transform:rotate(360deg); } }
  .start-btn { margin-top:22px; padding:14px 26px; border:none; border-radius:12px; background:#D4A574; color:#0F1838; font-size:16px; font-weight:bold; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
<div id="content"><div class="msg"><div class="spinner"></div><h2 id="loading">연결 중…</h2></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const params = new URLSearchParams(location.search);
const hubId = params.get('h');
let LANG = (function(){ const q=params.get('lang'); if(q==='ko'||q==='en')return q; return (navigator.language||'').toLowerCase().startsWith('ko')?'ko':'en'; })();
const I18N = {
  ko: { connectedTitle:'휴대폰 연결됨', waiting:'PC 화면을 준비하고 있습니다…', delayTitle:'연결이 지연됩니다', delayMsg:'PC에 허브 화면(/hub)이 열려 있는지 확인한 뒤 다시 시도하거나, 이 화면을 새로고침해 주세요.', retry:'다시 시도' },
  en: { connectedTitle:'Phone connected', waiting:'Preparing the PC screen…', delayTitle:'Connection delayed', delayMsg:'Make sure the hub screen (/hub) is open on the PC, then try again or refresh this page.', retry:'Try again' }
};
function t(k){ return (I18N[LANG]&&I18N[LANG][k]!==undefined)?I18N[LANG][k]:I18N.ko[k]; }
let navigated=false, hubGoTimer=null;
function showWaiting(){
  document.getElementById('content').innerHTML =
    '<div class="msg"><div class="spinner"></div><h2>\u2713 ' + t('connectedTitle') + '</h2><p>' + t('waiting') + '</p></div>';
}
function showDelay(){
  document.getElementById('content').innerHTML =
    '<div class="msg"><h2>\u26A0\uFE0F ' + t('delayTitle') + '</h2><p>' + t('delayMsg') + '</p>' +
    '<button class="start-btn" id="retryBtn">' + t('retry') + '</button></div>';
  const r=document.getElementById('retryBtn'); if(r) r.onclick=()=>{ showWaiting(); notifyHub(); armFallback(); };
}
function armFallback(){ if(hubGoTimer) clearTimeout(hubGoTimer); hubGoTimer=setTimeout(()=>{ if(!navigated) showDelay(); }, 12000); }
function gotoMobile(url){
  if(navigated) return; navigated=true;
  if(hubGoTimer){ clearTimeout(hubGoTimer); hubGoTimer=null; }
  try{ const u=new URL(url, location.origin); u.searchParams.set('lang', LANG); url=u.toString(); }catch(_){}
  location.href=url;
}
function notifyHub(){ if(hubId){ socket.emit('join-hub',{ hubId }); socket.emit('hub-scanned',{ hubId }); } }
socket.on('connect', notifyHub); notifyHub();   // 허브 룸 참여 + 디스플레이에 "스캔됨" 통지 → 디스플레이가 데모(/?h=)로 전환, 이후 hub-go 수신
socket.on('hub-go', ({ mobileUrl }) => { if(mobileUrl) gotoMobile(mobileUrl); });   // PC 세션 준비 완료 → 바로 인증 화면으로
showWaiting();
armFallback();
</script>
</body>
</html>
