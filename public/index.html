<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTK 멀티디바이스 시연 · PC · 데모 1</title>
<style>
  :root {
    --navy: #1E2761;
    --navy-dark: #0F1838;
    --amber: #D4A574;
    --amber-bright: #E8B97D;
    --amber-light: #FAEEDA;
    --amber-txt: #92400E;
    --pc-cyan: #5DADE2;
    --pc-cyan-dark: #1B5575;
    --pc-cyan-light: #E1F0FA;
    --ice: #F0F4FA;
    --text-dark: #1F2937;
    --text-mid: #475569;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --green: #166534;
    --green-bg: #DCFCE7;
    --red: #991B1B;
    --red-bg: #FEE2E2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, var(--ice) 0%, #ffffff 100%);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1280px; margin: 0 auto; }
  .header {
    background: var(--navy);
    color: white;
    padding: 24px 32px;
    border-radius: 12px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 22px; letter-spacing: 1px; }
  .header .badge {
    background: var(--amber);
    color: var(--navy-dark);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .lang-switch { display: flex; gap: 4px; }
  .lang-switch button { padding: 5px 12px; border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #fff; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
  .lang-switch button.on { background: var(--amber); border-color: var(--amber); color: var(--navy-dark); }
  .panel {
    background: white;
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 18px;
    color: var(--navy);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ice);
  }
  .pad-note { font-size: 13px; color: var(--text-mid); line-height: 1.6; margin-bottom: 14px; }
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
  }
  .reg-area {
    background: var(--amber-light);
    border: 2px dashed var(--amber);
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .reg-area label {
    display: block;
    color: var(--amber-txt);
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .reg-area input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--amber);
    border-radius: 6px;
    font-size: 18px;
    font-family: 'Consolas', monospace;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 10px;
  }
  .qr-section { text-align: center; }
  .qr-box {
    background: white;
    padding: 20px;
    border: 2px solid var(--border);
    border-radius: 12px;
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 12px auto;
    box-sizing: border-box;
  }
  .qr-box img {
    display: block;
    max-width: 100%;
    max-height: 60vh;
    width: auto;
    height: auto;
    border-radius: 8px;
    margin: 0 auto;
  }
  .qr-instruction {
    background: var(--amber-light);
    border-left: 4px solid var(--amber);
    padding: 14px 18px;
    border-radius: 6px;
    margin-top: 16px;
    text-align: left;
    font-size: 14px;
    line-height: 1.7;
    color: var(--amber-txt);
  }
  .mobile-url-display {
    background: var(--ice);
    padding: 10px 14px;
    border-radius: 6px;
    margin-top: 12px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: var(--navy-dark);
    word-break: break-all;
    text-align: left;
  }
  .pad-b {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 360px;
    margin: 16px auto;
  }
  .b-cell {
    aspect-ratio: 1;
    background: var(--pc-cyan-light);
    border: 2px solid var(--pc-cyan);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 24px;
    color: var(--pc-cyan-dark);
    user-select: none;
    font-weight: bold;
  }
  .b-cell:hover {
    background: var(--pc-cyan);
    color: white;
    transform: scale(1.03);
  }
  .b-cell.clicked {
    background: var(--navy);
    color: var(--amber-bright);
    border-color: var(--navy);
  }
  .b-cell.empty {
    background: #f8f8f8;
    border: 2px dashed #d0d0d0;
    cursor: default;
  }
  .b-cell.empty:hover {
    background: #f8f8f8;
    color: transparent;
    transform: none;
  }
  .pad-b.disabled .b-cell { pointer-events: none; opacity: 0.5; }
  .input-display {
    background: var(--ice);
    padding: 14px 18px;
    border-radius: 8px;
    margin: 16px 0;
    font-family: 'Consolas', monospace;
    font-size: 14px;
    color: var(--navy-dark);
    min-height: 48px;
    display: flex;
    align-items: center;
  }
  .progress {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 12px 0;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s;
  }
  .dot.filled { background: var(--navy); }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover { background: var(--navy-dark); }
  .btn-secondary { background: var(--border); color: var(--text-dark); }
  .btn-secondary:hover { background: var(--text-muted); color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    margin-top: 16px;
    padding: 16px 20px;
    border-radius: 8px;
    font-weight: bold;
    text-align: center;
    font-size: 15px;
  }
  .result.success { background: var(--green-bg); color: var(--green); }
  .result.failure { background: var(--red-bg); color: var(--red); }
  .pairing-status {
    background: var(--ice);
    padding: 14px 18px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--text-mid);
  }
  .pairing-status.connected { background: var(--green-bg); color: var(--green); font-weight: bold; }
  .log-panel {
    background: var(--navy-dark);
    color: var(--amber-bright);
    padding: 20px;
    border-radius: 12px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 24px;
  }
  .log-panel h3 {
    color: var(--amber);
    font-size: 13px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .log-line { margin: 4px 0; line-height: 1.5; }
  .log-time { color: var(--text-muted); }
  .session-info {
    background: var(--ice);
    padding: 12px 16px;
    border-radius: 8px;
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: var(--text-mid);
    margin-bottom: 16px;
    word-break: break-all;
  }
  .session-info .label {
    display: inline-block;
    color: var(--navy);
    font-weight: bold;
    margin-right: 8px;
  }
  .footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 16px;
    margin-top: 24px;
  }
  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
  }
  /* 휴대폰 세로: 헤더·여백 축소, QR은 폭에 맞춰 자동 축소 */
  @media (max-width: 600px) {
    body { padding: 10px; }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px; margin-bottom: 16px; }
    .header h1 { font-size: 16px; letter-spacing: 0.5px; }
    .header-right { width: 100%; justify-content: space-between; gap: 8px; }
    .header .badge { font-size: 11px; padding: 5px 10px; letter-spacing: 1px; }
    .panel { padding: 16px; }
    .panel h2 { font-size: 16px; }
    .qr-box { padding: 12px; }
    .session-info { font-size: 11px; }
    .pad-note { font-size: 12px; }
  }
  /* 휴대폰 가로(낮은 높이): 세로 공간 확보 + QR 높이 제한 + 푸터 숨김 */
  @media (max-height: 520px) {
    body { padding: 8px; }
    .header { padding: 6px 14px; margin-bottom: 8px; }
    .header h1 { font-size: 15px; }
    .session-info { margin-bottom: 6px; padding: 5px 12px; }
    .panel { padding: 10px; }
    .panel h2 { margin-bottom: 6px; padding-bottom: 6px; font-size: 15px; }
    .qr-box { margin: 4px auto; padding: 8px; }
    .qr-box img { max-height: 52vh; }
    .footer { display: none; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1 data-i18n="appTitle">VTK 멀티디바이스 시연 · PC (Live) · 데모 1</h1>
    <div class="header-right">
      <div class="lang-switch"><button id="langKo" class="on">KO</button><button id="langEn">EN</button></div>
      <span class="badge">LEVEL 3 · HIGH ASSURANCE</span>
    </div>
  </div>

  <!-- 데모1 4단계: 등록을 휴대폰으로 이전 — PC엔 등록 패널 없음, 로드 시 세션·QR 자동 생성 -->
  <div id="authPanel">

    <div class="session-info">
      <span class="label" data-i18n="sessionLabel">SESSION:</span><span id="sessionId">-</span>
      &nbsp;&nbsp;<span class="label" data-i18n="userLabel">USER:</span><span id="currentUser">-</span>
    </div>

    <!-- 단계 1: QR 스캔 안내 (처음엔 이것만 표시) -->
    <div id="stage1">
      <div class="panel qr-section">
        <h2 data-i18n="qrHeading">① 휴대폰으로 QR 코드 스캔</h2>
        <div class="qr-box" id="qrBox">
          <div style="padding:60px 0;color:var(--text-muted)">QR 코드 로딩 중...</div>
        </div>
      </div>
    </div>

    <!-- 단계 2: VIK 입력 (휴대폰이 QR을 스캔하면 표시) -->
    <div id="stage2" style="display:none;">
      <div class="panel">
        <h2 data-i18n="padHeading">② VIK · 무표시 (PC)</h2>
        <div class="pad-note" data-i18n-html="padNote">휴대폰의 VNK(숫자표시)에서 비밀번호 4자리의 <b>위치</b>를 확인한 뒤, 아래 VIK에서 같은 위치를 클릭하세요.</div>
        <div class="progress" id="progressDots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="pad-b disabled" id="padB"></div>
        <div class="controls">
          <button class="btn btn-secondary" onclick="resetInput()" data-i18n="btnReset">↺ 다시 입력</button>
          <button class="btn btn-primary" id="submitBtn" onclick="submitAuth()" disabled data-i18n="btnSubmit">인증 제출</button>
        </div>
        <div id="resultArea"></div>
      </div>
    </div>

  </div>

  <div class="footer">
    <span data-i18n="footer1">VTK Multi-Device Demo · Live Server with Socket.IO</span><br>
    <span data-i18n="footer2">옵틱라이트 주식회사 · PG502 검토용 시연 · 2026</span>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

const socket = io();

let currentUser = 'demo-user';    // 데모1 4단계: 사용자 ID 고정 (등록·비밀번호는 휴대폰에서)
let currentSid = null;
let userInput = [];
let mobilePaired = false;
let userRegistered = false;        // 휴대폰 등록 완료 여부 (키패드 활성화 조건)
let pairingStatusKey = 'pairingWait';
let pairingConnectedFlag = false;
let stage2Shown = false;           // QR 스캔 후 VIK(2단계) 표시 여부
const passwordLength = 4;

// 데모2식 단계 전환: 처음엔 QR(1단계)만, 스캔되면 VIK(2단계) 표시
function showStage1() {
  stage2Shown = false;
  const s1 = document.getElementById('stage1'), s2 = document.getElementById('stage2');
  if (s1) s1.style.display = 'block';
  if (s2) s2.style.display = 'none';
}
function showStage2() {
  if (stage2Shown) return;
  stage2Shown = true;
  const s1 = document.getElementById('stage1'), s2 = document.getElementById('stage2');
  if (s1) s1.style.display = 'none';
  if (s2) s2.style.display = 'block';
}

    seqWaitPair: 'Coordinate sequence C: (waiting for phone pairing)',
    seqWaitInput: 'Coordinate sequence C: (waiting…)',
    seqPrefix: 'Coordinate sequence C: ',
    seqReshuffled: 'Coordinate sequence C: reshuffled to a new layout — check the new positions on the phone (VNK), then click',
    qrFailed: 'QR generation failed',
    resultSuccess: '✓ Authentication successful — the plaintext password never flows anywhere',
    resultFailure: '✗ Authentication failed — please check the positions again',
    alertRegInput: 'Enter a user ID and a 4-digit numeric password',
    alertRegFail: 'Registration failed: ', alertStartFail: 'Failed to start authentication: ', alertConnFail: 'Server connection failed: ',
    logRegistered: 'Password registered from the phone — only the commitment is stored (plaintext D discarded)',
    logSessionHead: '━━━ New authentication session started ━━━',
    logSessionId: 'Session ID: {v}',
    logNewPi: 'Server: new π generated (to be sent only to the phone via Channel ①)',
    logPcJoin: 'Socket.IO: PC join',
    logPaired: 'Socket.IO: phone pairing signal received',
    logChan1: 'Channel ①: Server → π sent to the phone',
    logChan2: 'Channel ②: Server → empty VIK to the PC (π is not sent to the PC)',
    logClick: 'User: VIK coordinate [{i}] clicked',
    logSeqDone: 'Coordinate sequence C complete → awaiting submission',
    logReset: 'Input cleared',
    logSend: 'Channel ② → Server: coordinate sequence C = ({c}) sent',
    logCompute: 'Server: D\u2032 = \u03c0\u207b\u00b9(C) computed → "{d}"',
    logCompare: 'Server: comparing H(D\u2032 \u2225 salt)',
    logMatch: '✓ Commitment matched → authentication successful',
    logDiscard: 'Server: π and D\u2032 immediately discarded from memory',
    logAutoReshuffle: 'Server: authentication successful → used π discarded, auto-reshuffled with a new π (sent only to the phone VNK; the PC never sees π)',
    logManualReshuffle: 'Server: manual reshuffle → new π generated, only the phone (VNK) updated',
    logFail: '✗ Authentication failed',
    logError: 'Error: {v}',
    locale: 'en-US'
  }
};
let LANG = (function () {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'ko' || q === 'en') return q;
  return (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
})();
function t(key) { return (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key] : I18N.ko[key]; }

// 로그: 키(+치환값)와 시각을 저장해 언어 전환 시 다시 그림
const logEntries = [];
function fmt(str, vars) {
  if (!vars) return str;
  return str.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
}
function log(key, type = 'info', vars = null) {
  logEntries.push({ key, type, vars, time: new Date().toLocaleTimeString(t('locale')) });
  renderLog();
}
function renderLog() {
  const area = document.getElementById('logArea');
  if (!area) return;
  const colors = { info: '#E8B97D', success: '#86EFAC', warning: '#FCA5A5', system: '#94A3B8' };
  area.innerHTML = logEntries.map(e => {
    const raw = (I18N[LANG][e.key] !== undefined) ? t(e.key) : e.key;
    const text = fmt(raw, e.vars);
    return `<div class="log-line"><span class="log-time">[${e.time}]</span> <span style="color:${colors[e.type]}">${text}</span></div>`;
  }).join('');
  area.scrollTop = area.scrollHeight;
}

let lastAuthSuccess = null;   // 결과 배너 상태(언어 전환 대비)
function renderResult() {
  const area = document.getElementById('resultArea');
  if (!area || lastAuthSuccess === null) return;
  area.innerHTML = lastAuthSuccess
    ? '<div class="result success">' + t('resultSuccess') + '</div>'
    : '<div class="result failure">' + t('resultFailure') + '</div>';
}

function applyLanguage() {
  document.documentElement.lang = LANG;
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.getElementById('langKo').classList.toggle('on', LANG === 'ko');
  document.getElementById('langEn').classList.toggle('on', LANG === 'en');
  // 동적 요소
  const ps = document.getElementById('pairingStatus');
  if (ps) { ps.className = 'pairing-status' + (pairingConnectedFlag ? ' connected' : ''); ps.textContent = t(pairingStatusKey); }
  updateInputDisplay();
  renderLog();
  renderResult();
}
function setLanguage(lang) {
  if (lang === LANG) return;
  LANG = lang;
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  applyLanguage();
}

// 페어링/등록 상태 배너 갱신 (언어 전환 시 재적용 위해 키·연결상태 보관)
function setPairingStatus(key, connected) {
  pairingStatusKey = key;
  pairingConnectedFlag = !!connected;
  const ps = document.getElementById('pairingStatus');
  if (ps) { ps.className = 'pairing-status' + (connected ? ' connected' : ''); ps.textContent = t(key); }
}

async function startAuth() {
  try {
    const res = await fetch('/auth/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentUser })
    });
    const data = await res.json();
    if (data.error) {
      alert(t('alertStartFail') + data.error);
      return;
    }
    currentSid = data.sid;
    userInput = [];
    mobilePaired = false;
    userRegistered = false;
    showStage1();                       // 새 세션·QR → 다시 1단계(QR만)로
    document.getElementById('sessionId').textContent = currentSid;
    document.getElementById('currentUser').textContent = currentUser;
    setPairingStatus('pairingWait', false);
    document.getElementById('padB').classList.add('disabled');
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('submitBtn').disabled = true;

    log('logSessionHead', 'info');
    log('logSessionId', 'system', { v: currentSid });
    log('logNewPi', 'success');

    socket.emit('join-pc', { sid: currentSid });
    log('logPcJoin', 'system');

    // QR 코드 생성 - 휴대폰도 PC와 같은 언어로 열리도록 lang 부착
    const mobileUrl = data.mobileUrl + (data.mobileUrl.includes('?') ? '&' : '?') + 'lang=' + LANG;
    const qrSize = 400;
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${qrSize}x${qrSize}&data=${encodeURIComponent(mobileUrl)}&color=1E2761&bgcolor=ffffff&margin=10`;
    document.getElementById('qrBox').innerHTML = `
      <img src="${qrApiUrl}" width="${qrSize}" height="${qrSize}" alt="QR" style="display:block; border-radius:8px;"
           onerror="this.parentNode.innerHTML='<div style=\\'padding:40px;color:#991B1B\\'>'+t('qrFailed')+'</div>'">
    `;

    renderPadB();
    updateInputDisplay();
    updateProgressDots();
  } catch (err) {
    log('logError', 'warning', { v: err.message });
  }
}

socket.on('mobile-paired', () => {
  mobilePaired = true;
  showStage2();                                   // QR 스캔됨 → VIK(2단계) 표시
  setPairingStatus('pairingConnected', false);   // 연결됨 · 등록 대기 (키패드는 아직 비활성)
  log('logPaired', 'success');
});

// 휴대폰에서 비밀번호 등록 완료 → PC 키패드 활성화 (데모1 4단계)
socket.on('user-registered', ({ userId }) => {
  userRegistered = true;
  showStage2();                                   // 안전장치: 등록 시에도 2단계 보장
  if (userId) { currentUser = userId; document.getElementById('currentUser').textContent = userId; }
  setPairingStatus('pairingRegistered', true);
  document.getElementById('padB').classList.remove('disabled');
  log('logRegistered', 'success');
  log('logChan1', 'info');
  log('logChan2', 'info');
});

// 휴대폰 '새 세션(QR 재발급)' 요청 → PC가 새 세션·QR 재발급
socket.on('renew-session', () => {
  startAuth();
});

// 휴대폰에서 수동 재배치 → PC 입력만 초기화 (π는 PC로 오지 않음)
socket.on('reshuffled', () => {
  userInput = [];
  updateProgressDots();
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('resultArea').innerHTML = '';
  updateInputDisplay();
});

function renderPadB() {
  const padB = document.getElementById('padB');
  padB.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const cell = document.createElement('div');
    if (i === 9 || i === 11) {
      cell.className = 'b-cell empty';
    } else {
      cell.className = 'b-cell';
      cell.dataset.index = i;
      cell.textContent = '·';
      cell.onclick = () => handleCellClick(i, cell);
    }
    padB.appendChild(cell);
  }
}

function handleCellClick(idx, cellElem) {
  if (!userRegistered || userInput.length >= passwordLength) return;
  cellElem.classList.add('clicked');
  setTimeout(() => cellElem.classList.remove('clicked'), 300);
  userInput.push(idx);
  log('logClick', 'info', { i: idx });
  updateInputDisplay();
  updateProgressDots();
  if (userInput.length === passwordLength) {
    document.getElementById('submitBtn').disabled = false;
    log('logSeqDone', 'success');
  }
}

function updateInputDisplay() {
  const display = document.getElementById('inputDisplay');
  if (!display) return;
  if (userInput.length === 0) {
    display.textContent = userRegistered ? t('seqWaitInput') : t('seqWaitPair');
  } else {
    display.textContent = t('seqPrefix') + '(' + userInput.join(', ') + ')';
  }
}

function updateProgressDots() {
  document.querySelectorAll('.dot').forEach((dot, i) => {
    if (i < userInput.length) dot.classList.add('filled');
    else dot.classList.remove('filled');
  });
}

function resetInput() {
  userInput = [];
  updateInputDisplay();
  updateProgressDots();
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('resultArea').innerHTML = '';
  log('logReset', 'system');
}

// 인증 성공 후: 서버가 휴대폰(VNK)을 새 π로 자동 재배치함 → PC는 입력만 비워 다음 라운드 준비
// (결과 배너는 그대로 두어 성공을 잠시 보여줌)
function prepareNextRound() {
  userInput = [];
  updateProgressDots();
  document.getElementById('submitBtn').disabled = true;
  const display = document.getElementById('inputDisplay');
  if (display) display.textContent = t('seqReshuffled');
}

// 수동 재배치: 같은 세션 유지, 서버가 새 π 생성 후 휴대폰(VNK)만 갱신 (QR 재스캔 불필요)
async function manualReshuffle() {
  if (!currentSid) return;
  try {
    const res = await fetch('/auth/reshuffle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: currentSid })
    });
    const data = await res.json();
    if (data.error) { log('logError', 'warning', { v: data.error }); return; }
    userInput = [];
    lastAuthSuccess = null;
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('submitBtn').disabled = true;
    updateProgressDots();
    const display = document.getElementById('inputDisplay');
    if (display) display.textContent = t('seqReshuffled');
    log('logManualReshuffle', 'info');
  } catch (err) {
    log('logError', 'warning', { v: err.message });
  }
}

async function submitAuth() {
  log('logSend', 'info', { c: userInput.join(',') });
  try {
    const res = await fetch('/auth/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sid: currentSid, cSequence: userInput })
    });
    const data = await res.json();
    log('logCompute', 'system', { d: data.computedPassword });
    log('logCompare', 'system');
    const resultArea = document.getElementById('resultArea');
    if (data.ok) {
      log('logMatch', 'success');
      log('logAutoReshuffle', 'success');
      lastAuthSuccess = true; renderResult();
      prepareNextRound();          // 서버가 새 π를 휴대폰(VNK)에 밀어줌 → PC 입력만 초기화
    } else {
      log('logFail', 'warning');
      lastAuthSuccess = false; renderResult();
    }
  } catch (err) {
    log('logError', 'warning', { v: err.message });
  }
}

document.getElementById('langKo').onclick = () => setLanguage('ko');
document.getElementById('langEn').onclick = () => setLanguage('en');
document.getElementById('currentUser').textContent = currentUser;
applyLanguage();
startAuth();   // 데모1 4단계: 로드 시 세션·QR 자동 생성 (등록은 휴대폰에서)
</script>
</body>
</html>
